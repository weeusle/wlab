<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Skin Dev — skin1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #eef1f5; color: #0f172a; font-family: system-ui, sans-serif; font-size: 14px;
    }
    body.dark .preview { background: #6b7280; }
    .topbar { flex-shrink: 0; display: flex; align-items: center; gap: 14px; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 6px 12px; font-size: 13px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle__track { width: 34px; height: 20px; border-radius: 10px; background: #cbd5e1; position: relative; transition: background .2s; }
    .toggle__track.on { background: #2563eb; }
    .toggle__track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle__track.on::after { transform: translateX(14px); }
    .viewport { display: flex; gap: 2px; margin-left: auto; }
    .vp-btn { border: none; background: transparent; color: #64748b; font-size: 11px; padding: 4px 7px; border-radius: 6px; cursor: pointer; }
    .vp-btn.active { background: #e2e8f0; color: #0f172a; }

    .main { flex: 1; display: flex; min-height: 0; }
    .preview { flex: 1; display: flex; justify-content: center; min-height: 0; background: #eef1f5; }
    .preview iframe { height: 100%; border: none; display: block; transition: width .3s; box-shadow: 0 0 0 1px rgba(0,0,0,.1); background: #fff; }

    .editor { width: 360px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 18px 18px 60px; }
    .section + .section { margin-top: 26px; border-top: 1px solid #eef1f5; padding-top: 22px; }
    .section__title { font-size: 20px; font-weight: 800; margin: 0 0 16px; }
    .field { margin-bottom: 16px; }
    .field__label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; }

    .seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; gap: 4px; }
    .seg__btn { flex: 1; border: none; background: transparent; color: #475569; font-size: 13px; font-weight: 600; padding: 8px 6px; border-radius: 7px; cursor: pointer; }
    .seg__btn.active { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    .schemes { display: flex; gap: 8px; flex-wrap: wrap; }
    .scheme { width: 46px; height: 38px; border-radius: 8px; border: 2px solid transparent; padding: 0; cursor: pointer; overflow: hidden; position: relative; }
    .scheme.active { border-color: #2563eb; }
    .scheme.active::after { content: '✓'; position: absolute; top: -2px; right: 2px; color: #2563eb; font-weight: 700; font-size: 13px; }

    .colors { display: flex; flex-direction: column; gap: 10px; }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-dot { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #e2e8f0; padding: 0; cursor: pointer; overflow: hidden; }
    .color-dot input { opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; }
    .color-row span { font-weight: 600; }
    .hint { font-size: 12px; color: #94a3b8; margin: -6px 0 10px; }

    .inp { width: 100%; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc; padding: 9px 11px; font: inherit; color: inherit; }
    .inp:focus { outline: 2px solid #93c5fd; border-color: #93c5fd; }
    .txa { width: 100%; min-height: 66px; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc; padding: 9px 11px; font: inherit; color: inherit; resize: vertical; }

    .posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f1f5f9; border-radius: 10px; padding: 10px; width: 150px; }
    .pos-cell { height: 30px; border: none; border-radius: 7px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pos-cell:disabled { cursor: default; }
    .pos-cell .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
    .pos-cell:not(:disabled):hover .dot { background: #94a3b8; }
    .pos-cell.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .pos-cell.active .dot { background: #2563eb; width: 9px; height: 9px; }

    .slider { width: 100%; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-val { min-width: 34px; text-align: right; color: #64748b; }
    .offsets { display: flex; gap: 10px; }
    .off-inp { display: flex; align-items: center; gap: 6px; color: #64748b; }
    .off-inp input { width: 70px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; padding: 7px 9px; font: inherit; color: #0f172a; }
    .off-inp input:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="topbar">
    <label class="toggle"><span>Edit Mode</span><span class="toggle__track on" id="edit-track"></span></label>
    <div class="viewport" id="viewport">
      <button class="vp-btn active" data-w="100%">100%</button>
      <button class="vp-btn" data-w="1440px">1440</button>
      <button class="vp-btn" data-w="1280px">1280</button>
      <button class="vp-btn" data-w="1024px">1024</button>
      <button class="vp-btn" data-w="768px">768</button>
      <button class="vp-btn" data-w="600px">600</button>
      <button class="vp-btn" data-w="480px">480</button>
      <button class="vp-btn" data-w="375px">375</button>
    </div>
  </div>

  <div class="main">
    <div class="preview"><iframe id="frame" style="width:100%" src="./widget.html"></iframe></div>

    <div class="editor">
      <!-- ДИЗАЙН -->
      <div class="section">
        <h2 class="section__title">Дизайн</h2>
        <div class="field">
          <label class="field__label">Тема</label>
          <div class="seg" id="theme-seg">
            <button class="seg__btn active" data-mode="light">Светлая</button>
            <button class="seg__btn" data-mode="dark">Тёмная</button>
          </div>
        </div>
        <div class="field">
          <label class="field__label">Цветовые схемы</label>
          <div class="schemes" id="schemes"></div>
        </div>
        <div class="field">
          <label class="field__label">Цвета</label>
          <div class="hint">задайте сами или выберите цветовую схему</div>
          <div class="colors">
            <div class="color-row"><label class="color-dot"><input type="color" id="c-primary"></label><span>Основной</span></div>
            <div class="color-row"><label class="color-dot"><input type="color" id="c-bg"></label><span>Фон</span></div>
            <div class="color-row"><label class="color-dot"><input type="color" id="c-text"></label><span>Текст</span></div>
          </div>
        </div>
      </div>

      <!-- ТЕКСТЫ -->
      <div class="section">
        <h2 class="section__title">Тексты</h2>
        <div class="field">
          <label class="field__label">Основной текст</label>
          <textarea class="txa" id="t-text" placeholder="Основной текст"></textarea>
        </div>
        <div class="field">
          <label class="field__label">Политика</label>
          <input class="inp" id="t-policy" placeholder="Текст ссылки на политику">
        </div>
        <div class="field">
          <label class="field__label">Текст кнопки</label>
          <input class="inp" id="t-button" placeholder="Хорошо">
        </div>
      </div>

      <!-- НАСТРОЙКИ -->
      <div class="section">
        <h2 class="section__title">Настройки</h2>
        <div class="field">
          <label class="field__label">Размер</label>
          <div class="seg" id="size-seg">
            <button class="seg__btn active" data-mode="compact">Компактно</button>
            <button class="seg__btn" data-mode="fullwidth">На всю ширину</button>
          </div>
        </div>
        <div class="field">
          <label class="field__label">Расположение</label>
          <div class="posgrid" id="posgrid"></div>
        </div>
        <div class="field">
          <label class="field__label">Скругление углов</label>
          <div class="slider-row">
            <input class="slider" type="range" min="0" max="100" step="1" id="radius">
            <span class="slider-val" id="radius-val">50</span>
          </div>
        </div>
        <div class="field" id="offsets-field">
          <label class="field__label">Отступы на десктопе, px</label>
          <div class="offsets">
            <label class="off-inp">↔<input type="number" min="0" max="200" id="off-x"></label>
            <label class="off-inp">↕<input type="number" min="0" max="200" id="off-y"></label>
          </div>
          <div class="hint" id="offsets-hint" style="display:none;">Недоступно для «на всю ширину»</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var isDark = false;
      var lastConfig = {};
      var currentMode = 'compact';

      function post(type, payload) { if (frame.contentWindow) frame.contentWindow.postMessage(Object.assign({ type: type }, payload), '*'); }
      function setSetting(key, value) { post('wlab:dev:setSetting', { key: key, value: value }); }
      function mode() { return isDark ? 'dark' : 'light'; }
      function colorsOf(m) { var c = ((lastConfig.design) || {}).colors || {}; return c[m] || c.light || {}; }
      function hex6(v) { return /^#[0-9a-fA-F]{6}$/.test(v || '') ? v : '#000000'; }

      // Edit mode
      var editTrack = document.getElementById('edit-track');
      var editMode = true;
      editTrack.parentElement.addEventListener('click', function () {
        editMode = !editMode; editTrack.classList.toggle('on', editMode);
        post('wlab:dev:setEditMode', { editMode: editMode });
      });

      // Viewport
      document.querySelectorAll('#viewport .vp-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#viewport .vp-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); frame.style.width = b.dataset.w;
        });
      });

      // Theme
      document.querySelectorAll('#theme-seg .seg__btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          isDark = b.dataset.mode === 'dark';
          document.body.classList.toggle('dark', isDark);
          post('wlab:dev:setColorMode', { colorMode: mode() });
          refreshColorInputs();
        });
      });

      // Colour schemes (from altColors)
      function buildSchemes() {
        var box = document.getElementById('schemes'); box.innerHTML = '';
        var design = lastConfig.design || {};
        var alt = design.altColors; if (!alt) return;
        var arr = Array.isArray(alt) ? alt : [alt];
        var schemes = [{ colors: design.colors || {} }].concat(arr.map(function (a) { return { colors: a }; }));
        schemes.forEach(function (s) {
          var btn = document.createElement('button'); btn.className = 'scheme';
          var lc = s.colors.light || s.colors;
          var keys = ['primary', 'accent', 'background', 'text'].filter(function (k) { return lc[k]; });
          var pct = 100 / keys.length, stops = [];
          keys.forEach(function (k, i) { stops.push(lc[k] + ' ' + (i * pct) + '% ' + ((i + 1) * pct) + '%'); });
          btn.style.background = 'linear-gradient(to right,' + stops.join(',') + ')';
          btn.addEventListener('click', function () {
            document.querySelectorAll('#schemes .scheme').forEach(function (x) { x.classList.remove('active'); });
            btn.classList.add('active');
            lastConfig.design = lastConfig.design || {}; lastConfig.design.colors = s.colors;
            setSetting('design.colors', s.colors);
            refreshColorInputs();
          });
          box.appendChild(btn);
        });
      }

      // Colour pickers
      function paintDot(input) { input.parentElement.style.background = input.value; }
      function refreshColorInputs() {
        var c = colorsOf(mode());
        var p = document.getElementById('c-primary'); p.value = hex6(c.primary); paintDot(p);
        var b = document.getElementById('c-bg'); b.value = hex6(c.background); paintDot(b);
        var x = document.getElementById('c-text'); x.value = hex6(c.text); paintDot(x);
      }
      document.getElementById('c-primary').addEventListener('input', function () {
        paintDot(this);
        setSetting('design.colors.' + mode() + '.primary', this.value);
        setSetting('design.colors.' + mode() + '.accent', this.value);
      });
      document.getElementById('c-bg').addEventListener('input', function () { paintDot(this); setSetting('design.colors.' + mode() + '.background', this.value); });
      document.getElementById('c-text').addEventListener('input', function () { paintDot(this); setSetting('design.colors.' + mode() + '.text', this.value); });

      // Texts
      function bindText(id, key) { var el = document.getElementById(id); el.addEventListener('input', function () { setSetting('texts.' + key, el.value); }); }
      bindText('t-text', 'text');
      bindText('t-policy', 'policy');
      bindText('t-button', 'buttonText');

      // Size (layout.mode)
      document.querySelectorAll('#size-seg .seg__btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#size-seg .seg__btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); currentMode = b.dataset.mode;
          setSetting('settings.layout.mode', currentMode);
          updateOffsetsEnabled();
        });
      });

      // Offsets (отступы; недоступны для «на всю ширину»)
      var offX = document.getElementById('off-x'), offY = document.getElementById('off-y');
      var offHint = document.getElementById('offsets-hint');
      offX.addEventListener('input', function () { setSetting('settings.layout.offsetX', Number(offX.value || 0)); });
      offY.addEventListener('input', function () { setSetting('settings.layout.offsetY', Number(offY.value || 0)); });
      function updateOffsetsEnabled() {
        var full = (currentMode === 'fullwidth');
        offX.disabled = full; offY.disabled = full;
        offHint.style.display = full ? 'block' : 'none';
      }

      // Position (skin1: 8 positions, no center-center)
      var POS = ['top-left','top-center','top-right','center-left',null,'center-right','bottom-left','bottom-center','bottom-right'];
      function buildPosGrid() {
        var grid = document.getElementById('posgrid'); grid.innerHTML = '';
        var current = (((lastConfig.settings) || {}).layout || {}).position || 'bottom-right';
        POS.forEach(function (p) {
          var cell = document.createElement('button');
          cell.className = 'pos-cell' + (p === current ? ' active' : '');
          cell.disabled = !p;
          if (p) { var d = document.createElement('span'); d.className = 'dot'; cell.appendChild(d);
            cell.addEventListener('click', function () {
              grid.querySelectorAll('.pos-cell').forEach(function (x) { x.classList.remove('active'); });
              cell.classList.add('active'); setSetting('settings.layout.position', p);
            });
          }
          grid.appendChild(cell);
        });
      }

      // Border radius
      var radius = document.getElementById('radius'), radiusVal = document.getElementById('radius-val');
      radius.addEventListener('input', function () { radiusVal.textContent = radius.value; setSetting('settings.borderRadius', Number(radius.value)); });

      // Init
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'wlab:dev:frameReady') return;
        lastConfig = e.data.currentConfig || {};
        post('wlab:dev:setEditMode', { editMode: editMode });

        isDark = ((lastConfig.design) || {}).colorMode === 'dark';
        document.body.classList.toggle('dark', isDark);
        document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === mode()); });

        buildSchemes();
        refreshColorInputs();

        var t = lastConfig.texts || {};
        document.getElementById('t-text').value = t.text || '';
        document.getElementById('t-policy').value = t.policy || '';
        document.getElementById('t-button').value = t.buttonText || '';

        var lay = ((lastConfig.settings) || {}).layout || {};
        currentMode = lay.mode || 'compact';
        document.querySelectorAll('#size-seg .seg__btn').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === currentMode); });
        buildPosGrid();

        var br = ((lastConfig.settings) || {}).borderRadius; br = (br == null ? 50 : br);
        radius.value = br; radiusVal.textContent = br;

        offX.value = (lay.offsetX == null ? 16 : lay.offsetX);
        offY.value = (lay.offsetY == null ? 16 : lay.offsetY);
        updateOffsetsEnabled();
      });
    })();
  </script>
</body>
</html>
