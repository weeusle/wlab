<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Skin Dev — skin3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #eef1f5; color: #0f172a; font-family: system-ui, sans-serif; font-size: 14px;
    }
    body.dark .preview { background: #6b7280; }
    .topbar { flex-shrink: 0; display: flex; align-items: center; gap: 14px; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 6px 12px; font-size: 13px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle__track { width: 34px; height: 20px; border-radius: 10px; background: #cbd5e1; position: relative; transition: background .2s; }
    .toggle__track.on { background: #2563eb; }
    .toggle__track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle__track.on::after { transform: translateX(14px); }
    .viewport { display: flex; gap: 2px; margin-left: auto; }
    .vp-btn { border: none; background: transparent; color: #64748b; font-size: 11px; padding: 4px 7px; border-radius: 6px; cursor: pointer; }
    .vp-btn.active { background: #e2e8f0; color: #0f172a; }

    .main { flex: 1; display: flex; min-height: 0; }
    .preview { flex: 1; display: flex; justify-content: center; min-height: 0; background: #eef1f5; }
    .preview iframe { height: 100%; border: none; display: block; transition: width .3s; box-shadow: 0 0 0 1px rgba(0,0,0,.1); background: #fff; }

    .editor { width: 360px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 18px 18px 60px; }
    .section + .section { margin-top: 26px; border-top: 1px solid #eef1f5; padding-top: 22px; }
    .section__title { font-size: 20px; font-weight: 800; margin: 0 0 16px; }
    .field { margin-bottom: 16px; }
    .field__label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; }

    .seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; gap: 4px; }
    .seg__btn { flex: 1; border: none; background: transparent; color: #475569; font-size: 13px; font-weight: 600; padding: 8px 6px; border-radius: 7px; cursor: pointer; }
    .seg__btn.active { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    .schemes { display: flex; gap: 8px; flex-wrap: wrap; }
    .scheme { width: 40px; height: 38px; border-radius: 10px; border: 2px solid transparent; padding: 0; cursor: pointer; position: relative; }
    .scheme.active { border-color: #2563eb; }
    .scheme.active::after { content: '✓'; position: absolute; top: -3px; right: 1px; color: #2563eb; font-weight: 700; font-size: 13px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .switch-row span { font-size: 13px; font-weight: 600; }
    .hint { font-size: 12px; color: #94a3b8; margin: -6px 0 10px; }

    .inp { width: 100%; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc; padding: 9px 11px; font: inherit; color: inherit; }
    .inp:focus { outline: 2px solid #93c5fd; border-color: #93c5fd; }

    .btngroup { display: flex; flex-direction: column; gap: 6px; }
    .opt-btn { text-align: left; border: 1px solid #e2e8f0; background: #f8fafc; color: #0f172a; font: inherit; font-weight: 600; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
    .opt-btn.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="topbar">
    <label class="toggle"><span>Edit Mode</span><span class="toggle__track on" id="edit-track"></span></label>
    <div class="viewport" id="viewport">
      <button class="vp-btn active" data-w="100%">100%</button>
      <button class="vp-btn" data-w="1440px">1440</button>
      <button class="vp-btn" data-w="1280px">1280</button>
      <button class="vp-btn" data-w="1024px">1024</button>
      <button class="vp-btn" data-w="768px">768</button>
      <button class="vp-btn" data-w="600px">600</button>
      <button class="vp-btn" data-w="480px">480</button>
      <button class="vp-btn" data-w="375px">375</button>
    </div>
  </div>

  <div class="main">
    <div class="preview"><iframe id="frame" style="width:100%" src="./widget.html"></iframe></div>

    <div class="editor">
      <!-- ДИЗАЙН -->
      <div class="section">
        <h2 class="section__title">Дизайн</h2>
        <div class="field">
          <label class="field__label">Тема</label>
          <div class="seg" id="theme-seg">
            <button class="seg__btn active" data-mode="light">Светлая</button>
            <button class="seg__btn" data-mode="dark">Тёмная</button>
          </div>
        </div>
        <div class="field">
          <label class="field__label">Цветовые схемы</label>
          <div class="schemes" id="schemes"></div>
          <div class="hint">Цвета баннера заданы выбранной схемой (Тема 1–4) и зависят от режима Светлая/Тёмная</div>
        </div>
        <div class="switch-row"><span>Тень</span><span class="toggle__track on" id="shadow-track"></span></div>
        <div class="switch-row"><span>Логотип widget lab</span><span class="toggle__track on" id="logo-track"></span></div>
      </div>

      <!-- ТЕКСТЫ -->
      <div class="section">
        <h2 class="section__title">Тексты</h2>
        <div class="field">
          <label class="field__label">Основной текст</label>
          <input class="inp" id="t-main" placeholder="Мы используем cookie, чтобы сделать сайт удобнее и полезнее">
        </div>
        <div class="field">
          <label class="field__label">Текст кнопки</label>
          <input class="inp" id="t-btn" placeholder="Окей">
        </div>
      </div>

      <!-- НАСТРОЙКИ -->
      <div class="section">
        <h2 class="section__title">Настройки</h2>
        <div class="field">
          <label class="field__label">Раскладка</label>
          <div class="btngroup" id="layout-group"></div>
        </div>
        <div class="field">
          <label class="field__label">Плотность</label>
          <div class="btngroup" id="compact-group"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var isDark = false;
      var lastConfig = {};

      // 4 цветовые схемы skin3, значения из design-tokens.ts (THEMES).
      // Полоски свотча: primary, accent, bg, text.
      var THEMES = [
        { key: 'theme1', label: 'Тема 1', light: { primary: '#0047F0', accent: '#FF4D00', bg: '#FFFFFF', text: '#202020' }, dark: { primary: '#A6BFFF', accent: '#FF7033', bg: '#282828', text: '#FFFFFF' } },
        { key: 'theme2', label: 'Тема 2', light: { primary: '#00BB41', accent: '#9000FF', bg: '#FFFFFF', text: '#202020' }, dark: { primary: '#D0FF73', accent: '#CBA5FF', bg: '#282828', text: '#FFFFFF' } },
        { key: 'theme3', label: 'Тема 3', light: { primary: '#8E3DFF', accent: '#FFC300', bg: '#FFFFFF', text: '#202020' }, dark: { primary: '#CBA5FF', accent: '#FFE799', bg: '#282828', text: '#FFFFFF' } },
        { key: 'theme4', label: 'Тема 4', light: { primary: '#FF5500', accent: '#00BB41', bg: '#FFFFFF', text: '#202020' }, dark: { primary: '#FFBA97', accent: '#D0FF73', bg: '#282828', text: '#FFFFFF' } }
      ];
      var LAYOUTS = [
        { value: 'floating', label: 'Плавающая' },
        { value: 'full',     label: 'Во всю ширину' }
      ];
      var COMPACTS = [
        { value: 'auto',     label: 'Авто' },
        { value: 'expanded', label: 'Развёрнутая' },
        { value: 'compact',  label: 'Компактная' }
      ];

      function post(type, payload) { if (frame.contentWindow) frame.contentWindow.postMessage(Object.assign({ type: type }, payload), '*'); }
      function setSetting(key, value) { post('wlab:dev:setSetting', { key: key, value: value }); }
      function mode() { return isDark ? 'dark' : 'light'; }
      function settingsOf() { return (lastConfig.settings) || {}; }

      // Edit mode
      var editTrack = document.getElementById('edit-track');
      var editMode = true;
      editTrack.parentElement.addEventListener('click', function () {
        editMode = !editMode; editTrack.classList.toggle('on', editMode);
        post('wlab:dev:setEditMode', { editMode: editMode });
      });

      // Viewport
      document.querySelectorAll('#viewport .vp-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#viewport .vp-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); frame.style.width = b.dataset.w;
        });
      });

      // Тема (light/dark) → design.colorMode
      document.querySelectorAll('#theme-seg .seg__btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          isDark = b.dataset.mode === 'dark';
          document.body.classList.toggle('dark', isDark);
          post('wlab:dev:setColorMode', { colorMode: mode() });
          buildSchemes(); // свотчи показывают цвета текущего режима
        });
      });

      // Цветовые схемы (Тема 1–4) → settings.theme
      function buildSchemes() {
        var box = document.getElementById('schemes'); box.innerHTML = '';
        var current = settingsOf().theme || 'theme1';
        THEMES.forEach(function (t) {
          var c = t[mode()];
          var btn = document.createElement('button');
          btn.className = 'scheme' + (t.key === current ? ' active' : '');
          btn.title = t.label;
          btn.style.background = 'linear-gradient(to right,'
            + c.primary + ' 0% 25%,' + c.accent + ' 25% 50%,' + c.bg + ' 50% 75%,' + c.text + ' 75% 100%)';
          btn.addEventListener('click', function () {
            lastConfig.settings = lastConfig.settings || {}; lastConfig.settings.theme = t.key;
            setSetting('settings.theme', t.key);
            buildSchemes();
          });
          box.appendChild(btn);
        });
      }

      // Тень → design.shadow (по умолчанию вкл.)
      var shadowTrack = document.getElementById('shadow-track');
      shadowTrack.addEventListener('click', function () {
        var on = !shadowTrack.classList.contains('on');
        shadowTrack.classList.toggle('on', on);
        lastConfig.design = lastConfig.design || {}; lastConfig.design.shadow = on;
        setSetting('design.shadow', on);
      });

      // Логотип → design.hideLogo
      var logoTrack = document.getElementById('logo-track');
      logoTrack.addEventListener('click', function () {
        var on = !logoTrack.classList.contains('on'); // on = логотип показан
        logoTrack.classList.toggle('on', on);
        lastConfig.design = lastConfig.design || {}; lastConfig.design.hideLogo = !on;
        setSetting('design.hideLogo', !on);
      });

      // Тексты → settings.mainText / settings.buttonText
      function bindText(id, key) { var el = document.getElementById(id); el.addEventListener('input', function () { setSetting('settings.' + key, el.value); }); }
      bindText('t-main', 'mainText');
      bindText('t-btn', 'buttonText');

      // Раскладка → settings.layout
      function buildLayout() { buildBtnGroup('layout-group', LAYOUTS, 'layout', 'floating'); }
      // Плотность → settings.compact
      function buildCompact() { buildBtnGroup('compact-group', COMPACTS, 'compact', 'auto'); }
      function buildBtnGroup(boxId, options, key, def) {
        var box = document.getElementById(boxId); box.innerHTML = '';
        var current = settingsOf()[key] || def;
        options.forEach(function (o) {
          var btn = document.createElement('button');
          btn.className = 'opt-btn' + (o.value === current ? ' active' : '');
          btn.textContent = o.label;
          btn.addEventListener('click', function () {
            box.querySelectorAll('.opt-btn').forEach(function (x) { x.classList.remove('active'); });
            btn.classList.add('active');
            lastConfig.settings = lastConfig.settings || {}; lastConfig.settings[key] = o.value;
            setSetting('settings.' + key, o.value);
          });
          box.appendChild(btn);
        });
      }

      // Первичная отрисовка контролов сразу (на дефолтах), чтобы панель не пустела,
      // если сообщение frameReady от превью не пришло.
      buildSchemes();
      buildLayout();
      buildCompact();

      // Init из frameReady
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'wlab:dev:frameReady') return;
        lastConfig = e.data.currentConfig || {};
        post('wlab:dev:setEditMode', { editMode: editMode });

        isDark = ((lastConfig.design) || {}).colorMode === 'dark';
        document.body.classList.toggle('dark', isDark);
        document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === mode()); });

        var d = lastConfig.design || {};
        shadowTrack.classList.toggle('on', d.shadow !== false);
        logoTrack.classList.toggle('on', d.hideLogo !== true);

        var s = lastConfig.settings || {};
        document.getElementById('t-main').value = (typeof s.mainText === 'string' ? s.mainText : (lastConfig.texts || {}).mainText) || '';
        document.getElementById('t-btn').value = (typeof s.buttonText === 'string' ? s.buttonText : (lastConfig.texts || {}).buttonText) || '';

        buildSchemes();
        buildLayout();
        buildCompact();
      });
    })();
  </script>
</body>
</html>
