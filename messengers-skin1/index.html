<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Skin Dev — Мессенджеры · skin1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #eef1f5; color: #0f172a; font-family: system-ui, sans-serif; font-size: 14px;
    }
    body.dark .preview { background: #6b7280; }

    .topbar { flex-shrink: 0; display: flex; align-items: center; gap: 14px; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 6px 12px; font-size: 13px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle__track { width: 34px; height: 20px; border-radius: 10px; background: #cbd5e1; position: relative; transition: background .2s; flex-shrink: 0; }
    .toggle__track.on { background: #2563eb; }
    .toggle__track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle__track.on::after { transform: translateX(14px); }
    .viewport { display: flex; gap: 2px; margin-left: auto; }
    .vp-btn { border: none; background: transparent; color: #64748b; font-size: 11px; padding: 4px 7px; border-radius: 6px; cursor: pointer; }
    .vp-btn.active { background: #e2e8f0; color: #0f172a; }

    .main { flex: 1; display: flex; min-height: 0; }
    .preview { flex: 1; display: flex; justify-content: center; min-height: 0; background: #eef1f5; }
    .preview iframe { height: 100%; border: none; display: block; transition: width .3s; box-shadow: 0 0 0 1px rgba(0,0,0,.1); background: #fff; }

    .editor { width: 370px; flex-shrink: 0; background: #fff; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 18px 18px 60px; }
    .section + .section { margin-top: 26px; border-top: 1px solid #eef1f5; padding-top: 22px; }
    .section__title { font-size: 20px; font-weight: 800; margin: 0 0 16px; }
    .field { margin-bottom: 16px; }
    .field__label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; }

    .seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; gap: 4px; }
    .seg__btn { flex: 1; border: none; background: transparent; color: #475569; font-size: 13px; font-weight: 600; padding: 8px 6px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    .seg__btn.active { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    .colors { display: flex; flex-direction: column; gap: 10px; }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-dot { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #e2e8f0; padding: 0; cursor: pointer; overflow: hidden; position: relative; }
    .color-dot input { opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; }
    .color-row span { font-weight: 600; }
    .hint { font-size: 12px; color: #94a3b8; margin: -2px 0 8px; }

    .schemes { display: flex; gap: 8px; flex-wrap: wrap; }
    .scheme { width: 46px; height: 38px; border-radius: 8px; border: 2px solid transparent; padding: 0; cursor: pointer; overflow: hidden; position: relative; }
    .scheme:hover { opacity: .85; }
    .scheme.active { border-color: #2563eb; }
    .scheme.active::after { content: '✓'; position: absolute; top: -1px; right: 2px; color: #2563eb; font-weight: 700; font-size: 12px; }

    .inp, select.inp { width: 100%; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc; padding: 9px 11px; font: inherit; color: inherit; }
    .inp:focus { outline: 2px solid #93c5fd; border-color: #93c5fd; }

    /* channel groups */
    .grp { border: 1px solid #eef1f5; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .grp__head { display: flex; align-items: center; justify-content: space-between; }
    .grp__head b { font-size: 13px; font-weight: 700; }
    .grp__sub { margin-top: 12px; display: none; }
    .grp.on .grp__sub { display: block; }
    .grp__sub .field:last-child { margin-bottom: 0; }

    .posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f1f5f9; border-radius: 10px; padding: 10px; width: 150px; }
    .pos-cell { height: 30px; border: none; border-radius: 7px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pos-cell:disabled { cursor: default; }
    .pos-cell .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
    .pos-cell:not(:disabled):hover .dot { background: #94a3b8; }
    .pos-cell.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .pos-cell.active .dot { background: #2563eb; width: 9px; height: 9px; }

    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider { flex: 1; cursor: pointer; }
    .slider-val { min-width: 34px; text-align: right; color: #64748b; }
  </style>
</head>
<body>
  <div class="topbar">
    <label class="toggle"><span>Edit Mode</span><span class="toggle__track on" id="edit-track"></span></label>
    <div class="viewport" id="viewport">
      <button class="vp-btn active" data-w="100%">100%</button>
      <button class="vp-btn" data-w="1440px">1440</button>
      <button class="vp-btn" data-w="1280px">1280</button>
      <button class="vp-btn" data-w="1024px">1024</button>
      <button class="vp-btn" data-w="768px">768</button>
      <button class="vp-btn" data-w="600px">600</button>
      <button class="vp-btn" data-w="480px">480</button>
      <button class="vp-btn" data-w="375px">375</button>
    </div>
  </div>

  <div class="main">
    <div class="preview"><iframe id="frame" style="width:100%" src="./widget.html"></iframe></div>

    <div class="editor">
      <!-- ДИЗАЙН -->
      <div class="section">
        <h2 class="section__title">Дизайн</h2>
        <div class="field">
          <label class="field__label">Тема</label>
          <div class="seg" id="theme-seg">
            <button class="seg__btn active" data-mode="light">Светлая</button>
            <button class="seg__btn" data-mode="dark">Тёмная</button>
          </div>
        </div>
        <div class="field">
          <label class="field__label">Цветовые схемы</label>
          <div class="schemes" id="schemes"></div>
        </div>
        <div class="field">
          <label class="field__label">Цвета</label>
          <div class="hint">Бренд-цвета мессенджеров (MAX/TG/WA/ВК) фиксированы и не перекрашиваются.</div>
          <div class="colors">
            <div class="color-row"><label class="color-dot"><input type="color" id="c-primary"></label><span>Основной</span></div>
            <div class="color-row"><label class="color-dot"><input type="color" id="c-accent"></label><span>Акцент</span></div>
            <div class="color-row"><label class="color-dot"><input type="color" id="c-bg"></label><span>Фон</span></div>
            <div class="color-row"><label class="color-dot"><input type="color" id="c-text"></label><span>Текст</span></div>
          </div>
        </div>
        <div class="field">
          <label class="field__label">Скрыть лого wlab</label>
          <div class="seg" id="logo-seg">
            <button class="seg__btn" data-hide="0">Показать</button>
            <button class="seg__btn active" data-hide="1">Скрыть</button>
          </div>
        </div>
      </div>

      <!-- ТЕКСТЫ -->
      <div class="section">
        <h2 class="section__title">Тексты</h2>
        <div class="field"><label class="field__label">Заголовок панели (без звонка)</label><input class="inp" id="t-title" placeholder="Пишите — мы на связи"></div>
        <div class="field"><label class="field__label">Заголовок панели (со звонком)</label><input class="inp" id="t-titlecall" placeholder="Пишите, звоните — мы на связи"></div>
        <div class="field"><label class="field__label">Подсказка под заголовком</label><input class="inp" id="t-subtitle" placeholder="Сканируйте код с телефона"></div>
      </div>

      <!-- КАНАЛЫ СВЯЗИ -->
      <div class="section">
        <h2 class="section__title">Каналы связи</h2>

        <div class="grp" data-chan="max">
          <div class="grp__head"><b>MAX</b><span class="toggle__track" data-chantoggle="max"></span></div>
          <div class="grp__sub">
            <div class="field"><label class="field__label">Ссылка на чат</label><input class="inp" data-chanurl="max" placeholder="https://max.ru/"></div>
          </div>
        </div>
        <div class="grp" data-chan="telegram">
          <div class="grp__head"><b>Telegram</b><span class="toggle__track" data-chantoggle="telegram"></span></div>
          <div class="grp__sub">
            <div class="field"><label class="field__label">Ссылка на чат</label><input class="inp" data-chanurl="telegram" placeholder="https://t.me/..."></div>
          </div>
        </div>
        <div class="grp" data-chan="whatsapp">
          <div class="grp__head"><b>WhatsApp</b><span class="toggle__track" data-chantoggle="whatsapp"></span></div>
          <div class="grp__sub">
            <div class="field"><label class="field__label">Ссылка на чат</label><input class="inp" data-chanurl="whatsapp" placeholder="https://wa.me/7..."></div>
          </div>
        </div>
        <div class="grp" data-chan="vk">
          <div class="grp__head"><b>ВКонтакте</b><span class="toggle__track" data-chantoggle="vk"></span></div>
          <div class="grp__sub">
            <div class="field"><label class="field__label">Ссылка на чат</label><input class="inp" data-chanurl="vk" placeholder="https://vk.com/..."></div>
          </div>
        </div>
        <div class="grp" data-chan="phone">
          <div class="grp__head"><b>Звонок по телефону</b><span class="toggle__track" data-chantoggle="phone"></span></div>
          <div class="grp__sub">
            <div class="field"><label class="field__label">Номер телефона</label><input class="inp" id="t-phone" placeholder="+7 995 380 55 44"></div>
          </div>
        </div>

        <div class="field">
          <label class="field__label">Канал для QR-кода</label>
          <select class="inp" id="s-qr">
            <option value="max">MAX</option>
            <option value="telegram">Telegram</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="vk">ВКонтакте</option>
            <option value="phone">Звонок</option>
          </select>
        </div>
      </div>

      <!-- ВИД КНОПКИ -->
      <div class="section">
        <h2 class="section__title">Вид кнопки</h2>
        <div class="field">
          <label class="field__label">Свёрнутая кнопка</label>
          <select class="inp" id="s-collapsed">
            <option value="peek">С иконками соседних каналов</option>
            <option value="fab">Простая круглая</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label">Стиль кнопки</label>
          <select class="inp" id="s-fab">
            <option value="brand">Градиент</option>
            <option value="dark">Тёмная</option>
            <option value="white">Белая</option>
          </select>
        </div>
      </div>

      <!-- НАСТРОЙКИ -->
      <div class="section">
        <h2 class="section__title">Настройки</h2>
        <div class="field">
          <label class="field__label">Расположение</label>
          <div class="posgrid" id="posgrid"></div>
        </div>
        <div class="field">
          <label class="field__label">Скругление углов</label>
          <div class="slider-row"><input class="slider" type="range" min="0" max="40" step="1" id="radius"><span class="slider-val" id="radius-val">32</span></div>
        </div>
        <div class="field">
          <label class="field__label">Отступ по ширине, px</label>
          <div class="slider-row"><input class="slider" type="range" min="0" max="100" step="2" id="off-x"><span class="slider-val" id="off-x-val">16</span></div>
        </div>
        <div class="field">
          <label class="field__label">Отступ по высоте, px</label>
          <div class="slider-row"><input class="slider" type="range" min="0" max="100" step="2" id="off-y"><span class="slider-val" id="off-y-val">16</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var isDark = false;
      var lastConfig = {};
      var editMode = true;

      function post(type, payload) { if (frame.contentWindow) frame.contentWindow.postMessage(Object.assign({ type: type }, payload), '*'); }
      function setSetting(key, value) { post('wlab:dev:setSetting', { key: key, value: value }); }
      function mode() { return isDark ? 'dark' : 'light'; }
      function colorsOf(m) { var c = ((lastConfig.design) || {}).colors || {}; return c[m] || c.light || {}; }
      function hex6(v) { return /^#[0-9a-fA-F]{6}$/.test(v || '') ? v : '#000000'; }

      // Edit mode
      var editTrack = document.getElementById('edit-track');
      editTrack.parentElement.addEventListener('click', function () {
        editMode = !editMode; editTrack.classList.toggle('on', editMode);
        post('wlab:dev:setEditMode', { editMode: editMode });
      });

      // Viewport
      document.querySelectorAll('#viewport .vp-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#viewport .vp-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); frame.style.width = b.dataset.w;
        });
      });

      // Theme
      document.querySelectorAll('#theme-seg .seg__btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); isDark = b.dataset.mode === 'dark';
          document.body.classList.toggle('dark', isDark);
          post('wlab:dev:setColorMode', { colorMode: mode() });
          refreshColorInputs();
        });
      });

      // Colour schemes (задают primary/accent для обеих тем; фон/текст не трогают)
      var SCHEMES = [
        { id: 'indigo', label: 'Индиго',      l: '#5533EE', d: '#A6BFFF' },
        { id: 'blue',   label: 'Синяя',       l: '#0047F0', d: '#A6BFFF' },
        { id: 'green',  label: 'Зелёная',     l: '#00A854', d: '#5BE672' },
        { id: 'purple', label: 'Фиолетовая',  l: '#8E3DFF', d: '#CBA5FF' },
        { id: 'mono',   label: 'Моно',        l: '#222222', d: '#FFFFFF' }
      ];
      function ensureColors() {
        lastConfig.design = lastConfig.design || {};
        lastConfig.design.colors = lastConfig.design.colors || {};
        lastConfig.design.colors.light = lastConfig.design.colors.light || {};
        lastConfig.design.colors.dark = lastConfig.design.colors.dark || {};
      }

      function paintDot(input) { input.parentElement.style.background = input.value; }
      function refreshColorInputs() {
        var c = colorsOf(mode());
        [['c-primary','primary'],['c-accent','accent'],['c-bg','background'],['c-text','text']].forEach(function (pair) {
          var el = document.getElementById(pair[0]); el.value = hex6(c[pair[1]]); paintDot(el);
        });
      }
      function bindColor(id, key) {
        document.getElementById(id).addEventListener('input', function () {
          paintDot(this); ensureColors();
          lastConfig.design.colors[mode()][key] = this.value;
          setSetting('design.colors.' + mode() + '.' + key, this.value);
          markActiveScheme();
        });
      }
      bindColor('c-primary', 'primary');
      bindColor('c-accent', 'accent');
      bindColor('c-bg', 'background');
      bindColor('c-text', 'text');

      function applyScheme(s) {
        ensureColors();
        lastConfig.design.colors.light.primary = s.l; lastConfig.design.colors.light.accent = s.l;
        lastConfig.design.colors.dark.primary = s.d;  lastConfig.design.colors.dark.accent = s.d;
        setSetting('design.colors.light.primary', s.l);
        setSetting('design.colors.light.accent', s.l);
        setSetting('design.colors.dark.primary', s.d);
        setSetting('design.colors.dark.accent', s.d);
        refreshColorInputs();
      }
      function buildSchemes() {
        var box = document.getElementById('schemes'); box.innerHTML = '';
        SCHEMES.forEach(function (s) {
          var btn = document.createElement('button');
          btn.className = 'scheme'; btn.dataset.id = s.id; btn.title = s.label;
          btn.style.background = 'linear-gradient(to right, ' + s.l + ' 0 50%, ' + s.d + ' 50% 100%)';
          btn.addEventListener('click', function () { applyScheme(s); markActiveScheme(); });
          box.appendChild(btn);
        });
      }
      function markActiveScheme() {
        var lp = ((((lastConfig.design) || {}).colors || {}).light || {}).primary || '';
        document.querySelectorAll('#schemes .scheme').forEach(function (b) {
          var s = SCHEMES.filter(function (x) { return x.id === b.dataset.id; })[0];
          b.classList.toggle('active', !!(s && lp && lp.toLowerCase() === s.l.toLowerCase()));
        });
      }

      // Logo
      document.querySelectorAll('#logo-seg .seg__btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#logo-seg .seg__btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active'); setSetting('design.hideLogo', b.dataset.hide === '1');
        });
      });

      // Texts
      function bindText(id, key) { var el = document.getElementById(id); el.addEventListener('input', function () { setSetting('texts.' + key, el.value); }); }
      bindText('t-title', 'panelTitle');
      bindText('t-titlecall', 'panelTitleCall');
      bindText('t-subtitle', 'panelSubtitle');
      document.getElementById('t-phone').addEventListener('input', function () { setSetting('settings.phone', this.value); });

      // Channels — independent togglers; each grp shows its url/phone field when on
      function grpOfChan(key) { return document.querySelector('.grp[data-chan="' + key + '"]'); }
      document.querySelectorAll('[data-chantoggle]').forEach(function (tr) {
        tr.addEventListener('click', function () {
          var key = tr.dataset.chantoggle;
          var on = !tr.classList.contains('on');
          tr.classList.toggle('on', on);
          grpOfChan(key).classList.toggle('on', on);
          setSetting('settings.channels.' + key, on);
        });
      });
      document.querySelectorAll('[data-chanurl]').forEach(function (el) {
        el.addEventListener('input', function () { setSetting('settings.channelUrls.' + el.dataset.chanurl, el.value); });
      });
      document.getElementById('s-qr').addEventListener('change', function () { setSetting('settings.qrChannel', this.value); });

      // Appearance selects
      document.getElementById('s-collapsed').addEventListener('change', function () { setSetting('settings.collapsedStyle', this.value); });
      document.getElementById('s-fab').addEventListener('change', function () { setSetting('settings.fabStyle', this.value); });

      // Position grid (8 positions, center-center disabled) — ТЗ; key is settings.layout.position
      var POS = ['top-left','top-center','top-right','center-left',null,'center-right','bottom-left','bottom-center','bottom-right'];
      function buildPosGrid() {
        var grid = document.getElementById('posgrid'); grid.innerHTML = '';
        var current = (((lastConfig.settings) || {}).layout || {}).position || 'bottom-right';
        POS.forEach(function (p) {
          var cell = document.createElement('button');
          cell.className = 'pos-cell' + (p === current ? ' active' : ''); cell.disabled = !p;
          if (p) {
            var d = document.createElement('span'); d.className = 'dot'; cell.appendChild(d);
            cell.title = p;
            cell.addEventListener('click', function () {
              grid.querySelectorAll('.pos-cell').forEach(function (x) { x.classList.remove('active'); });
              cell.classList.add('active'); setSetting('settings.layout.position', p);
            });
          }
          grid.appendChild(cell);
        });
      }

      // Ranges
      function bindRange(id, valId, key) {
        var r = document.getElementById(id), v = document.getElementById(valId);
        r.addEventListener('input', function () { v.textContent = r.value; setSetting(key, Number(r.value)); });
      }
      bindRange('radius', 'radius-val', 'settings.borderRadius');
      bindRange('off-x', 'off-x-val', 'settings.layout.offsetX');
      bindRange('off-y', 'off-y-val', 'settings.layout.offsetY');

      // Init from widget config
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'wlab:dev:frameReady') return;
        lastConfig = e.data.currentConfig || {};
        post('wlab:dev:setEditMode', { editMode: editMode });

        isDark = ((lastConfig.design) || {}).colorMode === 'dark';
        document.body.classList.toggle('dark', isDark);
        document.querySelectorAll('#theme-seg .seg__btn').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === mode()); });
        refreshColorInputs();
        buildSchemes();
        markActiveScheme();

        var hide = ((lastConfig.design) || {}).hideLogo === true;
        document.querySelectorAll('#logo-seg .seg__btn').forEach(function (x) { x.classList.toggle('active', (x.dataset.hide === '1') === hide); });

        var t = lastConfig.texts || {};
        document.getElementById('t-title').value = t.panelTitle || '';
        document.getElementById('t-titlecall').value = t.panelTitleCall || '';
        document.getElementById('t-subtitle').value = t.panelSubtitle || '';

        var s = lastConfig.settings || {};
        var chans = s.channels || {}, urls = s.channelUrls || {};
        ['max','telegram','whatsapp','vk','phone'].forEach(function (k) {
          var on = chans[k] === true;
          var g = grpOfChan(k); if (g) { g.classList.toggle('on', on); var tr = g.querySelector('[data-chantoggle]'); if (tr) tr.classList.toggle('on', on); }
        });
        document.querySelectorAll('[data-chanurl]').forEach(function (el) { el.value = urls[el.dataset.chanurl] || ''; });
        document.getElementById('t-phone').value = s.phone || '';
        document.getElementById('s-qr').value = s.qrChannel || 'max';
        document.getElementById('s-collapsed').value = s.collapsedStyle || 'peek';
        document.getElementById('s-fab').value = s.fabStyle || 'brand';

        buildPosGrid();

        var layout = s.layout || {};
        var br = (s.borderRadius == null ? 32 : s.borderRadius);
        document.getElementById('radius').value = br; document.getElementById('radius-val').textContent = br;
        var ox = (layout.offsetX == null ? 16 : layout.offsetX), oy = (layout.offsetY == null ? 16 : layout.offsetY);
        document.getElementById('off-x').value = ox; document.getElementById('off-x-val').textContent = ox;
        document.getElementById('off-y').value = oy; document.getElementById('off-y-val').textContent = oy;
      });
    })();
  </script>
</body>
</html>
